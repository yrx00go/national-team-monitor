# ═══════════════════════════════════════════════════════════════════════
# 国家队监测站 · GitLab CI（抓数据 → 重算 → 提交 → 发布 Pages）
#
# 从 GitHub Actions 迁过来的原因：GitHub Pages 在国内访问不稳。
#
# ⚠ 三个必须知道的 GitLab 差异（迁的时候全踩过）：
#   ① 【定时任务不在 .gitlab-ci.yml 里配】
#      GitHub 的 cron 写在 workflow 文件里；GitLab 的定时任务（Pipeline schedules）
#      必须在网页上建：项目 → Build → Pipeline schedules → New schedule。
#      本文件里的 `rules` 只负责「什么条件下跑哪些 job」，不负责「什么时候触发」。
#      建 schedule 时把变量 RUN_UPDATE 设为 "1"（见下面的 rules 判断）。
#
#   ② 【Pages 只认 public/ 目录】
#      GitHub 可以指定任意 artifact 路径；GitLab 的 pages job 必须把产物放进 public/，
#      否则发布出来是 404。而且 pages job 的名字必须叫 `pages`（特殊保留名）。
#
#   ③ 【GitLab.com 免费版 Pages 需要单独启用】
#      项目 → Settings → General → Visibility → Pages → 勾选 "Everyone With Access"
#      否则 Pages 默认关闭，job 会过但站点打不开。
#
# ⚠ 还有一个更容易忽略的：
#   GitLab CI 的 `rules` 里如果没有匹配项，job 会被静默跳过（不报错、不提示）。
#   排查「为什么没跑」时先看 rules，不要先怀疑代码。
#
# ⚠ ④ 【CI_JOB_TOKEN 默认不能 git push】← 这条最要命，写完才发现
#   GitLab 官方文档原话：「您可以配置项目以允许使用 CI/CD 作业令牌进行身份认证的
#   Git 推送请求。**此设置默认关闭**。」默认情况下 CI_JOB_TOKEN 只能 clone/pull。
#   照抄 GitHub 的写法直接 push，得到的是一个 403，报错信息完全没提权限开关。
#
#   本项目的特殊性：深交所份额是「自建历史」（接口忽略日期参数，只能逐日累积），
#   所以【不 push 回仓库 = 历史永远补不回来】。这不是可选步骤。
#
#   两条路，二选一（本文件对两者都支持，优先用 PUSH_TOKEN）：
#   路 A（推荐，不动仓库权限）：
#     ① Settings → Access Tokens → Add new token，角色 Developer，勾 write_repository
#     ② Settings → CI/CD → Variables → Add variable
#        键名 PUSH_TOKEN，值粘刚生成的令牌，勾 Masked
#   路 B（最省事，一个勾选框）：
#     Settings → CI/CD → Expand「Job token permissions」
#     → 勾「Allow Git push requests to the repository」
#     然后确认 main 不是「只允许 Maintainer 推送」的保护分支（或把 CI bot 加进去）
#
#   两个都没配时，脚本会打一行明确的 ✗ 提示再退出，而不是甩一个 403 让人猜。
# ═══════════════════════════════════════════════════════════════════════

stages:
  - update
  - deploy

variables:
  # 只用 Python 标准库，不装任何第三方包 —— 少一个失败点
  PYTHONUNBUFFERED: "1"
  GIT_DEPTH: "5"              # 只需要最近几个 commit，浅克隆更快
  GIT_STRATEGY: clone

# ── 1. 抓取数据 ──────────────────────────────────────────────────────
update:
  stage: update
  image: python:3.11-slim
  timeout: 25m
  # ⚠ allow_failure: true 不是「不在乎失败」，是为了让 pages 还能跑。
  #   GitLab 的行为：needs 依赖的 job 失败且未标 allow_failure → 下游 job 直接 skipped。
  #   也就是说「数据抓到了、只是没推回仓库」这种半成功，会导致页面反而发不出去。
  #   标上之后：job 在流水线里显示橙色感叹号（可见），artifacts 照传，pages 照发。
  #   失败原因靠日志末尾的 ✗ 提示 + update_status.env 里的 UPDATE_EXIT / PUSH_FAILED 判断。
  allow_failure: true
  # 什么时候跑：
  #   ① 定时任务触发（网页上把 RUN_UPDATE 设为 "1"）
  #   ② 手动点「Run pipeline」
  #   ③ main 分支有提交（方便改完代码立刻验证一次）
  # ⚠ 三者满足其一即可。如果发现「定时没跑」，先确认 schedule 里的变量名拼写一致。
  rules:
    - if: '$RUN_UPDATE == "1"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'    # 兜底：schedule 没设变量也跑
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  before_script:
    - python3 -c "import json,urllib.request,zipfile,re,statistics;print('stdlib OK')"
    - python3 --version
    - git config --global user.name "gitlab-ci-bot"
    - git config --global user.email "ci-bot@noreply.gitlab.com"
    # ⚠ 推送凭据：优先项目访问令牌 PUSH_TOKEN，没有则退回 CI_JOB_TOKEN。
    #   注意 CI_JOB_TOKEN 只有在仓库设置里勾了「Allow Git push requests」才可推，
    #   否则这里能设成功、push 时才 403 —— 所以下面 push 失败时要给出可操作的提示。
    - |
      if [ -n "$PUSH_TOKEN" ]; then
        echo "推送方式：项目访问令牌 PUSH_TOKEN"
        git remote set-url origin "https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      else
        echo "推送方式：CI_JOB_TOKEN（需仓库已开启 Allow Git push requests）"
        git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      fi
  script:
    # update.py 的退出码：
    #   0 = 全部成功
    #   1 = 有可选步骤失败（数据已更新但不完整，页面照常发布）
    #   其他 = 核心步骤（份额）失败，数据没动
    # 这里不掩盖，记下状态让「降级发布」可见。
    - |
      set +e
      python3 scripts/update.py
      CODE=$?
      set -e
      echo "UPDATE_EXIT=$CODE" > update_status.env
      if [ $CODE -eq 1 ]; then
        echo "⚠ 降级发布：核心数据已更新，但有可选步骤失败，见上方日志"
      elif [ $CODE -ne 0 ]; then
        echo "✗ 核心抓取失败，数据未更新"
        exit $CODE
      fi
    # 提交数据。无变化就跳过，不产生空 commit。
    - |
      # ⚠ 先断言 demo_site.html 必须是【离线版】（Chart.js 已内联）。
      #   2026-11-12 抓到过：update.py 里写的是 build_demo.py（默认走 CDN），
      #   每天 CI 都用 1,762 KB 的 CDN 版把仓库里 1,967 KB 的离线版覆盖，
      #   再以 "data: 更新至 xxx" 的名义提交回来 —— 提交信息只是「更新数据」，
      #   实际把「断网也能看」每天静默拆掉一次。
      if grep -q 'cdnjs.cloudflare.com' demo_site.html; then
        echo "✗ demo_site.html 是 CDN 版，不是离线版"
        echo "  update.py 里 build_demo.py 少了 --offline 参数，见该文件第 6 步注释。"
        exit 1
      fi
      echo "✓ demo_site.html 为离线版（Chart.js 已内联）"

      git add data demo_site.html
      if git diff --staged --quiet; then
        echo "数据无变化，跳过提交"
        echo "CHANGED=false" >> update_status.env
      else
        LATEST=$(python3 -c "import json;print(json.load(open('data/demo.json'))['latest_date'])")
        git commit -m "data: 更新至 ${LATEST} [skip ci]"
        if git push origin HEAD:${CI_COMMIT_REF_NAME}; then
          echo "CHANGED=true" >> update_status.env
        else
          echo ""
          echo "✗✗✗ 数据已更新，但推送回仓库失败 ✗✗✗"
          echo "  深交所份额是自建历史（接口忽略日期参数，只能逐日累积），"
          echo "  这次不 push 回仓库，这一天的份额就永久缺失了。文档站点仍会发布，但历史有洞。"
          echo ""
          echo "  检查两项（二者其一即可，详见文件头 ④）："
          echo "    A. Settings → Access Tokens 建 Developer + write_repository 令牌，"
          echo "       存为 CI/CD 变量 PUSH_TOKEN（Masked）"
          echo "    B. Settings → CI/CD → Job token permissions → 勾"
          echo "       「Allow Git push requests to the repository」，"
          echo "       并确认 ${CI_COMMIT_REF_NAME} 不是只允许 Maintainer 推送的保护分支"
          echo ""
          echo "CHANGED=false" >> update_status.env
          echo "PUSH_FAILED=true" >> update_status.env
          exit 1
        fi
      fi
  artifacts:
    # 必须把产物传下去 —— deploy 是另一个 job，不共享工作区
    #
    # ⚠ when: always 不能省。默认是 on_success，意味着「job 一失败，产物就不上传」，
    #   于是「推送失败但数据已抓好」这种情况下，页面反而发不出去 —— 最不该的组合。
    #   加了 always，退化成「页面更新了、但仓库历史有洞」，至少当天的数据能看。
    when: always
    paths:
      - demo_site.html
      - data/
    reports:
      dotenv: update_status.env
    expire_in: 3 days

# ── 2. 发布 Pages ────────────────────────────────────────────────────
# ⚠ job 名必须叫 pages，产物必须放 public/ —— 这是 GitLab 的硬性约定，
#   改名字或改路径都会得到 404，且不会给出明确错误。
pages:
  stage: deploy
  image: alpine:latest
  needs:
    - job: update
      artifacts: true
  rules:
    - if: '$RUN_UPDATE == "1"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - mkdir -p public
    - cp demo_site.html public/index.html
    # data/ 也复制一份：页面数据是内联的，但保留原始 json 方便直接下载核对
    - cp -r data public/data
    # ⚠ manifest.json 和 icons/ 必须一起发，否则「装到桌面」会【静默失败】：
    #   index.html 里 <link rel="manifest"> 指向 manifest.json，取不到时 Chrome
    #   不报错、不提示，就是永远不出现安装按钮 —— 这是排查这类问题最费时的一种。
    #   图标同理：WebAPK 生成时要真的去取 192 和 512 两张 PNG。
    - cp manifest.json public/manifest.json
    - cp -r icons public/icons
    - echo "站点文件："
    - ls -la public/ public/data/ | head -30
    - echo "manifest 自检："
    - test -f public/manifest.json && echo "  ✓ manifest.json $(du -h public/manifest.json | cut -f1)"
    - test -f public/icons/icon-192.png && echo "  ✓ icon-192.png"
    - test -f public/icons/icon-512.png && echo "  ✓ icon-512.png"
    - test -f public/icons/icon-maskable-512.png && echo "  ✓ icon-maskable-512.png"
    - echo "index.html 大小：$(du -h public/index.html | cut -f1)"
  artifacts:
    paths:
      - public
    expire_in: 30 days

# ── 可选：失败时的排查提示 ──────────────────────────────────────────
# GitLab 没有 GitHub 那种 $GITHUB_STEP_SUMMARY，所以把提示打在日志末尾。
# 想看的话在 update job 失败后翻到最后几行。
